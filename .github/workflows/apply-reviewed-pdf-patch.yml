name: Apply reviewed PDF edit patch
on:
  push:
    branches:
      - fix/large-pdf-checklist-20261103
    paths:
      - .github/workflows/apply-reviewed-pdf-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/large-pdf-checklist-20261103
      - name: Verify and apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          echo '5518f2c3ac207adaf35754537932feb5cde043ea1c22835ae9b8da76f30edfa8  tools/patches/large-pdf-checklist-20261103.diff' | sha256sum -c -
          git apply --check tools/patches/large-pdf-checklist-20261103.diff
          git apply tools/patches/large-pdf-checklist-20261103.diff
          rm tools/patches/large-pdf-checklist-20261103.diff .github/workflows/apply-reviewed-pdf-patch.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions\[bot\]
          git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
          git commit -m 'Improve large PDF and checklist editing'
          git push origin HEAD:fix/large-pdf-checklist-20261103
