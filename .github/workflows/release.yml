name: Build and release The Viewer
on:
  push:
    branches: [main]
    paths:
      - release.json
      - pdf_page_dragger.py
      - requirements.txt
      - tools/build/**
      - scripts/**
      - tests/**
      - releases/**
      - .github/workflows/release.yml
  pull_request:
    paths:
      - release.json
      - pdf_page_dragger.py
      - requirements.txt
      - tools/build/**
      - scripts/**
      - tests/**
      - releases/**
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked installer for app updates (false keeps a draft)
        type: boolean
        default: false
      reuse_run_id:
        description: Optional original build run ID (required when matching artifacts are ambiguous)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  INPUT_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && toJSON(inputs.publish) || '' }}
  INPUT_REUSE_RUN_ID: ${{ inputs.reuse_run_id || '' }}
concurrency:
  group: viewer-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.config.outputs.version }}
    steps:
      - name: Preserve committed input bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check source, configuration and release safety tests
        run: |
          python scripts/validate_repository.py
          python -m unittest discover -s tests -v
      - name: Resolve release settings
        id: config
        run: python scripts/ci_common.py
  select-artifact:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Draft release discovery requires push access, even for public repos.
    # The selection script performs only reads; build jobs remain read-only.
    permissions:
      contents: write
      actions: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      artifact_name: ${{ steps.select.outputs.artifact_name }}
      artifact_id: ${{ steps.select.outputs.artifact_id }}
    steps:
      - name: Preserve committed input bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Preserve public releases or select the original checked build
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_artifact.py select
  windows-build:
    needs: [validate, select-artifact]
    if: needs.select-artifact.outputs.mode == 'build'
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Preserve committed input bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Prepare pinned source archives and notices
        run: python scripts/prepare_compliance.py
      - name: Build and check source, EXE, final location and installer
        run: python -u scripts/build_windows_release.py
      - name: Keep checked distribution
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.select-artifact.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Keep build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-build-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/windows-run/*.json
            build/windows-run/*.txt
            build/windows-run/logs/
          if-no-files-found: ignore
          retention-days: 14
  release:
    needs: [validate, select-artifact, windows-build]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
          needs.select-artifact.result == 'success' &&
          (needs.select-artifact.outputs.mode == 'reuse' ||
           (needs.select-artifact.outputs.mode == 'build' && needs.windows-build.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_ARTIFACT_ID: ${{ needs.select-artifact.outputs.artifact_id || needs.windows-build.outputs.artifact_id }}
    steps:
      - name: Preserve committed input bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Restore exact artifact ID and verify archive, inputs and original build jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_artifact.py restore
      - name: Verify files and prepare draft or publish checked release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
      - name: Keep release status and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-release-status-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/BUILD_VERIFICATION.json
            dist/ARTIFACT_RESTORE.json
            dist/Release_State.json
            dist/Upload_Result.json
            dist/gh_*.out
            dist/gh_*.log
          if-no-files-found: ignore
          retention-days: 14
