name: Windows PDF page regression

on:
  pull_request:
    paths:
      - pdf_page_dragger.py
      - tests/test_large_pdf_operations.py
      - .github/workflows/pdf-page-regression.yml
  push:
    branches: [main]
    paths:
      - pdf_page_dragger.py
      - tests/test_large_pdf_operations.py
      - .github/workflows/pdf-page-regression.yml

permissions:
  contents: read

jobs:
  page-operations:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install PDF and Qt runtime dependencies
        run: python -m pip install PySide6==6.11.1 pypdf==6.10.0 pypdfium2==5.14.0 Pillow==12.2.0
      - name: Check page copies, selection, undo and failure handling
        run: python -m unittest discover -s tests -p test_large_pdf_operations.py -v
